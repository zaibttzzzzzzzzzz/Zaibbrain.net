<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainzaib AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="brainzaib_logo.png" alt="Brainzaib AI Logo">
        </div>
        <h1>Welcome to Brainzaib AI</h1>
    </header>

    <main>
        <div class="chat-box">
            <div class="messages">
                <!-- Chat messages will appear here -->
            </div>
            <input type="text" id="user-input" placeholder="Ask me anything...">
            <button id="send-btn">Send</button>
        </div>
    </main>

    <footer>
        <p>Powered by Brainzaib AI | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
